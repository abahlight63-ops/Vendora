# Netlify deploy — Vendora marketing site (FALLBACK config).
# The ROOT /netlify.toml is the one Netlify actually reads — keep this file
# only for direct "website folder as site root" deploys (e.g. drag-and-drop).
# NOTE: publish is relative to base, so it must be "." here (NOT "website/" —
# that wrongly resolved to website/website and broke builds!).

[build]
  base = "website/"
  publish = "."
  command = ""

# Single page + anchors: any deep link serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
