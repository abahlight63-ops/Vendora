# ══ render.yaml — ONE-CLICK DEPLOY RECIPE (Infrastructure-as-Code!) ══
# WHAT: Render's Blueprint file: describes the web service (runtime, plan,
# build/start commands, health check, env vars) so deploys are repeatable.
# HOW: dashboard → New → Blueprint → select this repo. Render reads this file.
# LESSON: value: = baked-in default (safe, non-secret). sync: false = SECRET:
# Render prompts YOU for the value (dashboard or CLI) — it NEVER lives in git!
# generateValue: true = Render invents a random secret (sessions, admin key).
# healthCheckPath: /health must return 200 or Render restarts the service.
# Secrets are NEVER in this file — Render will prompt you for each value,
# or you paste them under Environment in the dashboard.
services:
  - type: web
    name: velosalesai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: ADS_VIDEO_HILLTOPADS
        sync: false
      - key: ADS_VIDEO_MONETAG
        sync: false
      - key: ADS_VIDEO_FALLBACK
        sync: false
      - key: ADS_VIDEO_ORDER
        value: sponsor,hilltopads,monetag,adsterra
      - key: SPONSOR_RATE_PER_VIEW
        value: 5
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_SHARED_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SHARED_BOT_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: VeloSales Ai <onboarding@resend.dev>
      - key: SUPPORT_EMAIL
        sync: false
      - key: STATICFORMS_KEY
        sync: false
      - key: META_APP_ID
        sync: false
