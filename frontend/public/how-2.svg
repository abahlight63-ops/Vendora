<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The assistant answering a customer at night">
  <!-- 2/3 "It sells while you sleep" — a reply lands after hours, from the catalog. -->
  <rect width="400" height="300" rx="18" fill="#0E0E0E"/>
  <circle cx="300" cy="238" r="52" fill="#D5B97F" opacity=".06"/>
  <!-- night sky: the shop is closed, the AI is not -->
  <circle cx="322" cy="60" r="26" fill="#D5B97F" opacity=".16"/>
  <circle cx="311" cy="53" r="24" fill="#0E0E0E"/>
  <circle cx="88" cy="46" r="3" fill="#D5B97F" opacity=".5"/>
  <circle cx="140" cy="70" r="2" fill="#D5B97F" opacity=".35"/>
  <circle cx="240" cy="40" r="2.5" fill="#D5B97F" opacity=".4"/>
  <!-- chat -->
  <rect x="52" y="104" width="200" height="40" rx="12" fill="#262320"/>
  <text x="70" y="129" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#CFC7BA">Do you still have it?</text>
  <rect x="126" y="156" width="222" height="86" rx="14" fill="#1F1B16" stroke="#7A5A1E" stroke-opacity=".55"/>
  <rect x="126" y="156" width="3" height="86" rx="1.5" fill="#D5B97F"/>
  <text x="146" y="180" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#F5F1EA">Yes — blue gown in stock</text>
  <text x="146" y="202" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#D5B97F">₦45,000</text>
  <text x="212" y="202" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#A8A094">· delivery ₦2,500</text>
  <rect x="146" y="214" width="118" height="18" rx="9" fill="#D5B97F" opacity=".16"/>
  <text x="157" y="227" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#D5B97F">from YOUR catalog</text>
  <!-- online dot: the one place green is allowed -->
  <circle cx="300" cy="222" r="6" fill="#1F7A4D"/>
  <circle cx="300" cy="222" r="11" fill="#1F7A4D" opacity=".22"/>
</svg>