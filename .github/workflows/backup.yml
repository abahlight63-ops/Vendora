name: Database backup

# Every night at 02:30 Lagos time (01:30 UTC), and any time from
# GitHub → Actions → Database backup → Run workflow.
# The backup only READS the database (one read-only transaction) and is
# encrypted before it is stored. Each backup is kept for 30 days.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL       the same value as on Render
#   BACKUP_PASSPHRASE  the same value as in your local .env
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Check the secrets are set
        id: ready
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup skipped: add DATABASE_URL and BACKUP_PASSPHRASE in Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Back up (read-only) and encrypt
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: out
        run: node scripts/backup-db.js
      - name: Prove the backup opens and is complete
        if: steps.ready.outputs.ok == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: out
        run: node scripts/backup-verify.js
      - name: Keep it for 30 days
        if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: velosales-db-${{ github.run_number }}
          path: out/*.vsbak
          retention-days: 30
          if-no-files-found: error
