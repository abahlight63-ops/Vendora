      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: PRICE_MONTHLY_NAIRA
        value: 7499
      - key: PRICE_YEARLY_NAIRA
        value: 69999
      - key: PRICE_PLUS_MONTHLY_NAIRA
        value: 14999
      - key: PRICE_PLUS_YEARLY_NAIRA
        value: 119999
      - key: PRICE_MONTHLY_USD
