<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="An unsure conversation flagged for the owner">
  <!-- 3/3 "You close the hot ones" — the AI hands the human moment over, with the customer's words attached. -->
  <rect width="400" height="300" rx="18" fill="#0E0E0E"/>
  <circle cx="60" cy="56" r="40" fill="#D5B97F" opacity=".05"/>
  <!-- flagged card -->
  <rect x="48" y="44" width="304" height="212" rx="18" fill="#141210" stroke="#2A2621"/>
  <rect x="48" y="44" width="304" height="46" rx="18" fill="#191714"/>
  <rect x="48" y="70" width="304" height="20" fill="#191714"/>
  <path d="M74 56 v22 M74 56 h18 l-5 7 5 7 H74" stroke="#D5B97F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="104" y="60" width="112" height="12" rx="6" fill="#3A342C"/>
  <rect x="266" y="58" width="70" height="18" rx="9" fill="#D5B97F" opacity=".18" stroke="#D5B97F" stroke-opacity=".4"/>
  <text x="283" y="71" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#D5B97F">FLAGGED</text>
  <!-- the customer's own words -->
  <rect x="72" y="108" width="238" height="44" rx="12" fill="#262320"/>
  <text x="90" y="134" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#CFC7BA">I want 20. Can we talk?</text>
  <!-- metadata rows -->
  <circle cx="82" cy="182" r="5" fill="#D5B97F"/>
  <rect x="96" y="176" width="140" height="11" rx="5.5" fill="#3A342C"/>
  <circle cx="82" cy="212" r="5" fill="#4A443C"/>
  <rect x="96" y="206" width="106" height="11" rx="5.5" fill="#2E2A24"/>
  <!-- hand-off button -->
  <rect x="228" y="196" width="108" height="34" rx="17" fill="#D5B97F"/>
  <text x="252" y="217" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#241705">Take it</text>
</svg>