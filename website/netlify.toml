# Netlify deploy — VeloSales Ai marketing site (FALLBACK config).
# The ROOT /netlify.toml is the one Netlify actually reads — keep this file
# only for direct "website folder as site root" deploys (e.g. drag-and-drop).
# NOTE: publish is relative to base, so it must be "." here (NOT "website/" —
# that wrongly resolved to website/website and broke builds!).
#
# NO SPA CATCH-ALL: every page is a real index.html. Unknown paths fall through
# to 404.html on purpose, so crawlers see a true 404 instead of a soft one.

[build]
  base = "website/"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
