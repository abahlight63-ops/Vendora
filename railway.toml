# ── railway.toml ─────────────────────────────────────────────────
# WHAT: Railway build/deploy recipe (Nixpacks reads this automatically).
#nixpacks-specific: builder NIXPACKS (default for Node), build + start commands.
# Railway IGNORES render.yaml (Render-only) and vice versa — both files coexist.
[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
