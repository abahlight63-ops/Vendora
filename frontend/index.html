<!-- ── frontend/index.html ──────────────────────────────────────────
  WHAT: the ONLY HTML file. Everything React renders goes inside #root.
  Vite injects built JS/CSS here at build time; dev serves main.jsx directly.
  Each tag explained: charset (UTF-8 everywhere, no mojibake) · viewport
  (mobile scaling! without it phones render desktop-width) · title (tab text)
  · description (Google snippet = free SEO) · theme-color (browser chrome tint
  on mobile) · icon (tab favicon) · preconnect (early-connect to Google Fonts
  = faster first paint) · #root (React mount point) · module script (Vite entry).
  LESSON: React apps ship ONE html file (SPA = Single Page App); "pages" are
  just JS swapping DOM inside #root while the URL changes (BrowserRouter). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloSales Ai — AI WhatsApp Sales Assistant</title>
<meta name="description" content="VeloSales Ai turns your WhatsApp number into a 24/7 AI sales rep — instant answers in English or Pidgin, straight from your catalog." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1614" media="(prefers-color-scheme: dark)" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<!-- ══ SITE OWNERSHIP VERIFICATION TAGS (Google / Bing / ad networks) ══
     WHAT: these <meta> tags prove YOU own this domain to Google Search
     Console, Bing Webmaster, Monetag, Hilltop, etc. Each service gives you
     a code → you paste it HERE → rebuild + redeploy → click Verify THERE.
     RULES:
     1. One tag per service (Google + Bing + each ad network can coexist!).
     2. NEVER delete a tag while that dashboard still shows "verified" —
        some services re-check monthly and unverify you silently.
     3. After ANY edit here: rebuild + redeploy (Vite bakes index.html at
        build time — dashboard edits alone change nothing until deploy!).
     4. Prefer TAG method (below). Alternatives: FILE method (drop the file
        they give you into frontend/public/ — it serves at /filename — then
        rebuild) or DNS method (TXT record at your registrar, no code change).
     WHERE TO ADD A NEW ONE: paste the new <meta> line right below the
     google-site-verification line, keeping the same pattern. -->
<meta name="51626916332c3f8a8610f0a537ed520b4f567d73" content="51626916332c3f8a8610f0a537ed520b4f567d73" /> <!-- ad-network ownership token (Monetag/Hilltop-style 32-hex) — leave while that dashboard shows verified -->
<meta name="google-site-verification" content="BFuzp4Yg1ikNpWscJ6hz8A04ymD2OiGZCsjeoDPr4P8" /> <!-- Google Search Console (search.google.com/search-console → add property → HTML tag → copy code here) -->
<!-- Bing Webmaster (bing.com/webmasters → add site → copy code → UNCOMMENT the line below, paste your code, rebuild): -->
<!-- <meta name="msvalidate.01" content="PASTE-BING-CODE-HERE" /> -->
<link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<!-- the brand mark is painted in the very first frame (splash + sidebar), so
     warm the cache for it before React boots -->
<link rel="preload" as="image" href="/logo-mark.png" fetchpriority="high" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="dns-prefetch" href="https://ipapi.co" />
<link rel="dns-prefetch" href="https://accounts.google.com" />
<meta property="og:title" content="VeloSales Ai — Your WhatsApp shop, open 24/7" />
<meta name="d3fc6b69181612796155cb0dee5dd9e3dbb93947" content="d3fc6b69181612796155cb0dee5dd9e3dbb93947" /> <!-- second ad-network ownership token (same rules as above — leave while verified) -->
<meta property="og:description" content="AI sales assistant for WhatsApp. Instant answers in English or Pidgin, straight from your catalog." />
<meta property="og:type" content="website" />
<meta property="og:image" content="/photos/og.jpg" />
<!-- Set the theme BEFORE first paint (mirrors lib/theme.js): one read of
     localStorage, default 'system'. Without this the page paints light and
     then flips — a white flash on every load for dark-mode visitors. -->
<script>
  (function () {
    var pref = 'system';
    try { var s = localStorage.getItem('velosales-theme'); if (s === 'system' || s === 'light' || s === 'dark') pref = s; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'system' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themePref = pref;
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
