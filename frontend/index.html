<!-- ── frontend/index.html ──────────────────────────────────────────
  WHAT: the ONLY HTML file. Everything React renders goes inside #root.
  Vite injects built JS/CSS here at build time; dev serves main.jsx directly.
  Each tag explained: charset (UTF-8 everywhere, no mojibake) · viewport
  (mobile scaling! without it phones render desktop-width) · title (tab text)
  · description (Google snippet = free SEO) · theme-color (browser chrome tint
  on mobile) · icon (tab favicon) · preconnect (early-connect to Google Fonts
  = faster first paint) · #root (React mount point) · module script (Vite entry).
  LESSON: React apps ship ONE html file (SPA = Single Page App); "pages" are
  just JS swapping DOM inside #root while the URL changes (BrowserRouter). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloSales Ai — AI WhatsApp Sales Assistant</title>
<meta name="description" content="VeloSales Ai turns your WhatsApp number into a 24/7 AI sales rep — instant answers in English or Pidgin, straight from your catalog." />
<meta name="theme-color" content="#0d1f16" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<meta name="7cdc7be33039175983122cdb65fef9c7df072129" content="7cdc7be33039175983122cdb65fef9c7df072129" />
<link rel="icon" type="image/png" href="/logo.png?v=3" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="dns-prefetch" href="https://ipapi.co" />
<link rel="dns-prefetch" href="https://accounts.google.com" />
<meta property="og:title" content="VeloSales Ai — Your WhatsApp shop, open 24/7" />
<meta property="og:description" content="AI sales assistant for WhatsApp. Instant answers in English or Pidgin, straight from your catalog." />
<meta property="og:type" content="website" />
<meta property="og:image" content="/photos/og.jpg" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
